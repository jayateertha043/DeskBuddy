[platformio]
; Build outside OneDrive: syncing hundreds of .o files mid-build locks them and
; stalls the compiler. Keep build artifacts on a local, non-synced path.
build_dir = C:/pio_build/DeskBuddy-SuperMini
; Tasks build/upload/monitor only the ESP32-C3 by default.
default_envs = esp32-c3-devkitm-1

[common]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
; Do NOT hardcode a COM port. Ports change per PC and per board.
; Ports are auto-selected by USB vendor ID (VID) in each env below, so any
; COMx assignment works. To force a port once: pio run -t upload --upload-port COMx
; or set the PLATFORMIO_UPLOAD_PORT / PLATFORMIO_MONITOR_PORT env variables.

; Native USB CDC (ESP32-C3 Super Mini uses built-in USB Serial/JTAG, VID 0x303A)
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit BusIO@^1.16.1

; Full DeskBuddy application (default)
[env:esp32-c3-devkitm-1]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
; ESP32-C3 native USB Serial/JTAG = VID 303A
upload_port = hwgrep://303A
monitor_port = hwgrep://303A
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
build_src_filter = +<*.cpp> +<core/*.cpp> +<net/*.cpp> +<display/*.cpp>

; Same DeskBuddy application (shared main.cpp) built for ESP8266 (NodeMCU / Wemos D1)
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_speed = 115200
monitor_speed = 115200
; NodeMCU/Wemos USB-serial bridge: CH340 = VID 1A86, CP2102 = VID 10C4.
; hwgrep accepts either; edit if your board uses a different bridge.
upload_port = hwgrep://1A86|10C4
monitor_port = hwgrep://1A86|10C4
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit BusIO@^1.16.1
    ; ESP32-compatible Preferences API backed by LittleFS (NVS-style storage)
    vshymanskyy/Preferences@^2.2.2
; Both boards compile the same application source; platform.h isolates the
; ESP8266/ESP32 differences (WiFi, web server, mDNS, HTTP, TLS, storage, pins).
build_src_filter = +<*.cpp> +<core/*.cpp> +<net/*.cpp> +<display/*.cpp>
